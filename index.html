<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a1a;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --secondary: #06b6d4;
            --text: #f0f0f0;
            --text-muted: #94a3b8;
            --correct: #10b981;
            --incorrect: #ef4444;
            --cursor: #facc15;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 50%, rgba(124,58,237,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(6,182,212,0.1) 0%, transparent 50%);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-light);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .timer-box .stat-value {
            color: #f97316;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 0.5rem 0 2rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            transition: width 1s linear;
        }

        .paragraph-display {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 1.1rem;
            line-height: 1.8;
            min-height: 120px;
            margin-bottom: 1.5rem;
            user-select: none;
            white-space: pre-wrap;
            word-break: break-word;
            letter-spacing: 0.5px;
        }

        .paragraph-display span {
            transition: color 0.08s, background 0.08s;
        }

        .char-correct {
            color: var(--correct);
        }

        .char-incorrect {
            color: var(--incorrect);
            background: rgba(239,68,68,0.15);
        }

        .char-current {
            background: var(--cursor);
            color: #000;
            border-radius: 2px;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .input-area textarea {
            width: 100%;
            padding: 1rem;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 1rem;
            background: rgba(0,0,0,0.3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            resize: none;
            height: 90px;
            outline: none;
            transition: border 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--primary-light);
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        button {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(124,58,237,0.4);
        }

        .btn-restart {
            background: rgba(239,68,68,0.8);
            color: white;
        }

        .btn-restart:hover {
            background: #ef4444;
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .history {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .history h3 {
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .history-item {
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }

        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
        }

        .result-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .result-card {
            background: rgba(20,20,40,0.95);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .result-card h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-light);
        }

        .grade {
            font-size: 4rem;
            margin: 1rem 0;
        }

        .result-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .result-item {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 12px;
        }

        .result-item .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .result-item .label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.2rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .stat-box {
                padding: 0.7rem;
            }
            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Typing Speed Pro</h1>
            <p>Test your speed with elegance</p>
        </div>

        <div class="stats-bar">
            <div class="stat-box timer-box">
                <div class="stat-value" id="timer">60</div>
                <div class="stat-label">Seconds</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="wpm">0</div>
                <div class="stat-label">WPM</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="accuracy">100%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="errors">0</div>
                <div class="stat-label">Errors</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="paragraph-display" id="paragraph"></div>

        <div class="input-area">
            <textarea id="input" placeholder="Click 'Start Test' to begin..." disabled></textarea>
        </div>

        <div class="buttons">
            <button id="startBtn" class="btn-start">Start Test</button>
            <button id="restartBtn" class="btn-restart" disabled>Restart</button>
        </div>

        <div class="history">
            <h3>Previous Results</h3>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <h2>Test Complete</h2>
            <div class="grade" id="grade"></div>
            <div class="result-stats">
                <div class="result-item">
                    <div class="value" id="resWpm">0</div>
                    <div class="label">WPM</div>
                </div>
                <div class="result-item">
                    <div class="value" id="resAccuracy">0%</div>
                    <div class="label">Accuracy</div>
                </div>
                <div class="result-item">
                    <div class="value" id="resErrors">0</div>
                    <div class="label">Errors</div>
                </div>
                <div class="result-item">
                    <div class="value" id="resCorrect">0</div>
                    <div class="label">Correct</div>
                </div>
            </div>
            <button id="closeResult" class="btn-restart">Try Again</button>
        </div>
    </div>

    <script>
        const paragraphs = [
            "The quick brown fox jumps over the lazy dog. This sentence contains every letter of the alphabet, perfect for typing practice and improving speed.",
            "Programming is the art of telling a computer what to do. It demands logic, patience, and a willingness to learn from every mistake you make.",
            "Technology has transformed the way we live, communicate, and learn. With great power comes great responsibility to use it wisely for the benefit of all.",
            "Success is not final, failure is not fatal: it is the courage to continue that counts. Every expert was once a beginner who refused to give up.",
            "A journey of a thousand miles begins with a single step. Start small, stay consistent, and you will achieve great things over time.",
            "The sun rises in the east and sets in the west. Nature follows its own rhythm, and so should we, finding balance between work and rest."
        ];

        let currentParagraph = '';
        let startTime = null;
        let timerInterval = null;
        let timeRemaining = 60;
        let isActive = false;
        let hasStarted = false;
        let correctChars = 0;
        let totalTyped = 0;
        let errorCount = 0;
        let currentPos = 0;

        const paragraphEl = document.getElementById('paragraph');
        const inputEl = document.getElementById('input');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const timerEl = document.getElementById('timer');
        const wpmEl = document.getElementById('wpm');
        const accuracyEl = document.getElementById('accuracy');
        const errorsEl = document.getElementById('errors');
        const progressBar = document.getElementById('progress-bar');
        const resultOverlay = document.getElementById('resultOverlay');
        const gradeEl = document.getElementById('grade');
        const resWpm = document.getElementById('resWpm');
        const resAccuracy = document.getElementById('resAccuracy');
        const resErrors = document.getElementById('resErrors');
        const resCorrect = document.getElementById('resCorrect');
        const closeResult = document.getElementById('closeResult');
        const historyList = document.getElementById('historyList');

        function pickRandomParagraph() {
            return paragraphs[Math.floor(Math.random() * paragraphs.length)];
        }

        function renderParagraph() {
            paragraphEl.innerHTML = '';
            for (let i = 0; i < currentParagraph.length; i++) {
                const span = document.createElement('span');
                span.textContent = currentParagraph[i];
                span.id = `char-${i}`;
                paragraphEl.appendChild(span);
            }
            updateHighlight();
        }

        function updateHighlight() {
            const spans = paragraphEl.querySelectorAll('span');
            spans.forEach((span, i) => {
                span.classList.remove('char-correct', 'char-incorrect', 'char-current');
                if (i < currentPos) {
                    span.classList.add(inputEl.value[i] === currentParagraph[i] ? 'char-correct' : 'char-incorrect');
                } else if (i === currentPos && isActive) {
                    span.classList.add('char-current');
                }
            });
        }

        function updateStats() {
            const elapsed = (Date.now() - startTime) / 60000;
            const wpm = elapsed > 0 ? Math.round((correctChars / 5) / elapsed) : 0;
            wpmEl.textContent = wpm;
            const accuracy = totalTyped > 0 ? Math.round((correctChars / totalTyped) * 100) : 100;
            accuracyEl.textContent = accuracy + '%';
            errorsEl.textContent = errorCount;
        }

        function updateTimerDisplay() {
            timerEl.textContent = timeRemaining;
            progressBar.style.width = (timeRemaining / 60) * 100 + '%';
            if (timeRemaining <= 0) {
                endTest();
            }
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                updateStats();
            }, 1000);
        }

        function startTest() {
            if (isActive) return;
            currentParagraph = pickRandomParagraph();
            inputEl.value = '';
            inputEl.disabled = false;
            inputEl.focus();
            currentPos = 0;
            correctChars = 0;
            totalTyped = 0;
            errorCount = 0;
            timeRemaining = 60;
            startTime = null;
            hasStarted = false;
            isActive = true;
            timerEl.textContent = timeRemaining;
            progressBar.style.width = '100%';
            wpmEl.textContent = '0';
            accuracyEl.textContent = '100%';
            errorsEl.textContent = '0';
            renderParagraph();
            startBtn.disabled = true;
            restartBtn.disabled = false;
        }

        function endTest() {
            if (!isActive) return;
            isActive = false;
            clearInterval(timerInterval);
            inputEl.disabled = true;
            startBtn.disabled = false;
            restartBtn.disabled = true;

            const elapsed = (Date.now() - startTime) / 60000;
            const finalWpm = elapsed > 0 ? Math.round((correctChars / 5) / elapsed) : 0;
            const finalAccuracy = totalTyped > 0 ? Math.round((correctChars / totalTyped) * 100) : 100;

            showResult(finalWpm, finalAccuracy, errorCount, correctChars);
            saveResult(finalWpm, finalAccuracy, errorCount);

            document.querySelector('.char-current')?.classList.remove('char-current');
        }

        function showResult(wpm, accuracy, errors, correct) {
            resWpm.textContent = wpm;
            resAccuracy.textContent = accuracy + '%';
            resErrors.textContent = errors;
            resCorrect.textContent = correct;

            let grade;
            if (wpm >= 60 && accuracy >= 95) grade = '🏆 A+';
            else if (wpm >= 50 && accuracy >= 90) grade = '🥇 A';
            else if (wpm >= 40 && accuracy >= 85) grade = '🥈 B';
            else if (wpm >= 30 && accuracy >= 75) grade = '🥉 C';
            else grade = '📘 D';

            gradeEl.textContent = grade;
            resultOverlay.classList.add('active');
        }

        function saveResult(wpm, accuracy, errors) {
            const history = JSON.parse(localStorage.getItem('typingHistory')) || [];
            history.push({
                wpm,
                accuracy,
                errors,
                date: new Date().toLocaleString()
            });
            if (history.length > 10) history.shift();
            localStorage.setItem('typingHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('typingHistory')) || [];
            if (history.length === 0) {
                historyList.innerHTML = '<div style="color: #666;">No results yet</div>';
                return;
            }
            historyList.innerHTML = history.slice().reverse().map(item =>
                `<div class="history-item">
                    <span>${item.date}</span>
                    <span>WPM: ${item.wpm} | Acc: ${item.accuracy}% | Errors: ${item.errors}</span>
                </div>`
            ).join('');
        }

        function resetTest() {
            isActive = false;
            clearInterval(timerInterval);
            inputEl.disabled = true;
            inputEl.value = '';
            startBtn.disabled = false;
            restartBtn.disabled = true;
            timerEl.textContent = '60';
            progressBar.style.width = '100%';
            wpmEl.textContent = '0';
            accuracyEl.textContent = '100%';
            errorsEl.textContent = '0';
            currentParagraph = '';
            paragraphEl.innerHTML = '<span style="color: #666;">Click "Start Test" to begin...</span>';
            startTime = null;
            currentPos = 0;
        }

        startBtn.addEventListener('click', startTest);
        restartBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            resetTest();
            startTest();
        });
        closeResult.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
            resetTest();
        });

        inputEl.addEventListener('input', (e) => {
            if (!isActive) return;
            if (!hasStarted) {
                hasStarted = true;
                startTimer();
            }
            const typed = e.target.value;
            if (typed.length > currentParagraph.length) {
                inputEl.value = typed.slice(0, currentParagraph.length);
                return;
            }
            currentPos = typed.length;
            totalTyped = typed.length;
            let correct = 0;
            let errors = 0;
            for (let i = 0; i < typed.length; i++) {
                if (typed[i] === currentParagraph[i]) correct++;
                else errors++;
            }
            correctChars = correct;
            errorCount = errors;
            updateHighlight();
            updateStats();
            if (typed.length === currentParagraph.length) endTest();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab' && !isActive) {
                e.preventDefault();
                resetTest();
                startTest();
            }
        });

        resetTest();
        renderHistory();
    </script>
</body>
</html>
